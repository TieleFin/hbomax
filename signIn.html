<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/signIn.css">
    <title>Entrar</title>
</head>

<body>
    <nav class="menu">
        <a href="index.html">
            <img src="assets/images/hbo-logo.svg" alt="Logotipo HBO" class="menu__logo">
        </a>
        <div>
            <a href="signIn.html" class="menu__item">ENTRAR</a>
            <a href="#subscription" class="menu__becorated">ASSINE AGORA</a>
        </div>
    </nav>
    <main class="content">
        <form class="login__container">
            <h1 class="login__title">Entrar</h1>
            <label class="login__label">Você já tem uma conta na HBO Max?</label>
            <input class="login__field" type="email" name="email" id="email" placeholder="Endereço de e-mail">
            <input class="login__field" type="password" name="password" id="password" placeholder="Senha" minlength="8">
            <div class="login__actions">
                <button type="submit" class="gradient-button login__button">Entrar</button>
                <a href="#" class="login__link">Esqueceu a Senha?</a>
            </div>
        </form>
    </main>
    <footer class="footer">
        <div class="footer__container">
            <div>
                <div class="footer__links">
                    <a class="footer__links__item" href="https://www.max.com/br/pt">Agora na HBO Max</a>
                    <a class="footer__links__item" href="https://www.max.com/br/pt">Em breve</a>
                    <a class="footer__links__item" href="https://www.max.com/br/pt">Filme em Destaque</a>
                    <a class="footer__links__item" href="https://www.max.com/br/pt">Série</a>
                    <a class="footer__links__item" href="https://www.max.com/br/pt">Ajuda</a>
                </div>
                <div>
                    <p>© 2025 WarnerMedia Direct Latin America, LLC. Todos os direitos reservados. HBO Max é usado sob
                        licença.</p>
                </div>
            </div>
            <div class="footer__icons">
                <a href="https://www.facebook.com/hbomaxbr/">
                    <img src="assets/images/fb_0.png" alt="Logotipo Facebook">
                </a>
                <a href="https://x.com/HBOMaxBR">
                    <img src="assets/images/twitter_0.png" alt="Logotipo Twitter">
                </a>
                <a href="https://www.instagram.com/hbomaxbr/">
                    <img src="assets/images/instagram_0.png" alt="Logotipo Instagram">
                </a>
                <a href="https://www.youtube.com/c/hbomaxbr">
                    <img src="assets/images/youtube_0.png" alt="Logotipo YouTube">
                </a>
            </div>
        </div>
    </footer>
</body>

</html>
